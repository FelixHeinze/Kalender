    <title> Kalender</title>
    <body>
        <h1 id="mainHeadline">Kalender</h1> 
        <div class="grid-container">
            <div class="item1" > 
                <span id="infoZuDatum"></span>
                <!-- //Der <span id="datumAusgeschrieben"></span> ist ein <span id="wochentag"></span> und zwar der <span id="wieviele"></span> 
                <span id="wochentagAusgeschrieben"></span> im Monat <span class="monatsname"></span> des Jahres <span id="jahreszahl"></span>. 
                Es handelt sich um den <span id="xTag"></span>. Tag des Jahres, was bedeutet, dass es noch <span id="xJahresende"></span> 
                Tage bis zum Jahresende sind. Der Monat <span class="monatsname"></span> 
                hat insgesamt <span id="monatstage"></span> Tage. Heute ist <span id="feiertag"></span> gesetzlicher Feiertag in Deutschland 
                
                probe dynamisch-->
                
            </div>
            <div class="item2">
        <table id="kalenderDynamisch">
            
            <button id="vorherigerMonat" onclick="vorherigerMonat()">&#8249;</button> <!-- //&#8249; code das symbol < -->
            <button id="naechsterMonat" onclick="naechsterMonat()">&#8250;</button> <!-- //&#8250; code für das symbol > -->
           <!--  // bei klick auf button wird die funktion aufgerufen --> 
            <tr>
                <th>Mo</th>
                <th>Di</th>
                <th>Mi</th>
                <th>Do</th>
                <th>Fr</th>
                <th id="samstag">Sa</th>
                <th id="sonntag">So</th>
            </tr>

        </table>
            </div>
            <div    class="item3">
                <!-- historische ereignisse dynamisch generieren -->

                <h2>Historische Ereignisse am <span id="ereignisseDatum"></span></h2>
